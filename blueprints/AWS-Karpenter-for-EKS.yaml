spec_version: 2
description: Creates the AWS IAM roles, instance profile, EventBridge rules, and SQS queue required to run Karpenter on an existing EKS cluster. Deploy the Karpenter Helm chart separately and point it at
  the outputs of this blueprint.
metadata:
  self-service: true
  display-name: AWS Karpenter for EKS
  icon:
    path: graphics/AWS EKS.svg
  blueprint-labels:
    - key: hypervisor
      value: AWS
      initial-color: '#FF9900'
    - key: category
      value: Cloud
      initial-color: '#1E88E5'
    - key: Terraform
      initial-color: '#7B42BC'
inputs:
  cluster_name:
    type: string
    description: Name of the existing EKS cluster Karpenter will manage nodes for.
  namespace:
    type: string
    default: kube-system
    description: Kubernetes namespace where the Karpenter controller will run. The AWS-recommended namespace is "kube-system".
  service_account:
    type: string
    default: karpenter
    description: Name of the Kubernetes ServiceAccount for the Karpenter controller. The IAM-role-to-SA binding uses this name.
  enable_pod_identity:
    type: string
    default: 'true'
    description: Use EKS Pod Identity (recommended, modern). With "true" the cluster needs the pod-identity addon installed; no OIDC provider config is required. Set "false" to fall back to IRSA, in which
      case irsa_oidc_provider_arn must be supplied.
    allowed-values:
      - 'true'
      - 'false'
  resource_tags:
    type: string
    default: '{}'
    description: JSON map of tags applied to created IAM roles, instance profile, and SQS queue.
  agent:
    type: agent
outputs:
  iam_role_arn:
    value: '{{ .grains.karpenter.outputs.iam_role_arn }}'
    quick: true
  node_iam_role_arn:
    value: '{{ .grains.karpenter.outputs.node_iam_role_arn }}'
    quick: true
  node_iam_role_name:
    value: '{{ .grains.karpenter.outputs.node_iam_role_name }}'
    quick: false
  instance_profile_name:
    value: '{{ .grains.karpenter.outputs.instance_profile_name }}'
    quick: false
  queue_name:
    value: '{{ .grains.karpenter.outputs.queue_name }}'
    quick: true
  queue_arn:
    value: '{{ .grains.karpenter.outputs.queue_arn }}'
    quick: false
  service_account:
    value: '{{ .grains.karpenter.outputs.service_account }}'
    quick: false
  namespace:
    value: '{{ .grains.karpenter.outputs.namespace }}'
    quick: false
grains:
  karpenter:
    kind: terraform
    spec:
      source:
        store: AWS
        path: assets/terraform-aws-eks-karpenter
      namespace: '{{ .inputs.namespace }}'
      agent:
        name: '{{ .inputs.agent }}'
      tags:
        auto-tag: true
      inputs:
        - cluster_name: '{{ .inputs.cluster_name }}'
        - namespace: '{{ .inputs.namespace }}'
        - service_account: '{{ .inputs.service_account }}'
        - enable_pod_identity: '{{ .inputs.enable_pod_identity }}'
        - irsa_oidc_provider_arn: 'null'
        - tags: '{{ .inputs.resource_tags }}'
        - create: 'true'
        - create_access_entry: 'true'
        - create_iam_role: 'true'
        - create_instance_profile: 'true'
        - create_node_iam_role: 'true'
        - create_pod_identity_association: 'true'
        - enable_irsa: 'false'
        - enable_spot_termination: 'true'
        - access_entry_type: EC2_LINUX
        - ami_id_ssm_parameter_arns: '[]'
        - cluster_ip_family: ipv4
        - iam_policy_description: 'null'
        - iam_policy_name: 'null'
        - iam_policy_path: /
        - iam_policy_use_name_prefix: 'false'
        - iam_role_description: 'null'
        - iam_role_max_session_duration: 'null'
        - iam_role_name: 'null'
        - iam_role_path: /
        - iam_role_permissions_boundary_arn: 'null'
        - iam_role_policies: '{}'
        - iam_role_tags: '{}'
        - iam_role_use_name_prefix: 'false'
        - irsa_assume_role_condition_test: StringEquals
        - irsa_namespace_service_accounts: '["kube-system:karpenter"]'
        - node_iam_role_additional_policies: '{}'
        - node_iam_role_arn: 'null'
        - node_iam_role_attach_cni_policy: 'true'
        - node_iam_role_description: 'null'
        - node_iam_role_max_session_duration: 'null'
        - node_iam_role_name: 'null'
        - node_iam_role_path: /
        - node_iam_role_permissions_boundary: 'null'
        - node_iam_role_tags: '{}'
        - node_iam_role_use_name_prefix: 'true'
        - queue_kms_data_key_reuse_period_seconds: '300'
        - queue_kms_master_key_id: 'null'
        - queue_managed_sse_enabled: 'true'
        - queue_name: 'null'
        - rule_name_prefix: Karpenter
      outputs:
        - iam_role_arn
        - node_iam_role_arn
        - node_iam_role_name
        - instance_profile_name
        - queue_name
        - queue_arn
        - service_account
        - namespace
    tf-version: 1.5.7
