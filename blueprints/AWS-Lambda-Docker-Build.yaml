spec_version: 2
description: Builds a Docker image locally and pushes it to ECR for use as a Lambda container image.
metadata:
  self-service: true
  display-name: AWS Lambda Docker Build
  icon:
    path: graphics/AWS Lambda.svg
  blueprint-labels:
    - key: hypervisor
      value: AWS
      initial-color: aws
    - key: category
      value: Cloud
      initial-color: teal
    - key: Terraform
      initial-color: pink
inputs:
  ecr_repo:
    type: string
    description: ECR repository name (e.g. "my-app/lambda"). Created automatically when create_ecr_repo is true.
  ecr_address:
    type: string
    description: ECR registry address, e.g. <account-id>.dkr.ecr.<region>.amazonaws.com.
  image_tag:
    type: string
    default: latest
    description: Image tag to push (e.g. "v1.2.3", "latest", a commit SHA).
  source_path:
    type: string
    description: Path to the Docker build context (the folder with your Dockerfile).
  platform:
    type: string
    default: linux/amd64
    description: Target CPU architecture for the image. Use linux/arm64 if you plan to run on Graviton Lambda.
    allowed-values:
      - linux/amd64
      - linux/arm64
  agent:
    type: agent
outputs:
  image_uri:
    value: '{{ .grains.docker-build.outputs.image_uri }}'
    quick: true
grains:
  docker-build:
    kind: terraform
    spec:
      source:
        store: AWS
        path: assets/terraform-aws-lambda-docker-build
      agent:
        name: '{{ .inputs.agent }}'
      tags:
        auto-tag: true
      inputs:
        - ecr_repo: '{{ .inputs.ecr_repo }}'
        - ecr_address: '{{ .inputs.ecr_address }}'
        - image_tag: '{{ .inputs.image_tag }}'
        - source_path: '{{ .inputs.source_path }}'
        - platform: '{{ .inputs.platform }}'
        - create_ecr_repo: 'true'
        - build_args: '{}'
        - create_sam_metadata: 'false'
        - docker_file_path: Dockerfile
        - ecr_force_delete: 'false'
        - ecr_repo_lifecycle_policy: 'null'
        - ecr_repo_tags: '{}'
        - force_remove: 'false'
        - image_tag_mutability: IMMUTABLE
        - keep_locally: 'false'
        - keep_remotely: 'true'
        - scan_on_push: 'true'
        - triggers: '{}'
        - use_image_tag: 'true'
      outputs:
        - image_uri
    tf-version: 1.15.1
