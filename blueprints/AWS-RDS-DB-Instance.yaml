spec_version: 2
description: "Creates an Amazon RDS database instance. Choose a database engine and the master credentials are auto-managed by AWS Secrets Manager \u2014 the secret ARN is exposed as an output."
metadata:
  self-service: true
  display-name: AWS RDS Database Instance
  icon:
    path: graphics/AWS RDS.svg
  blueprint-labels:
    - key: hypervisor
      value: AWS
    - key: category
      value: Cloud
    - key: Terraform
customization:
  launch-form:
    categories:
      - name: Basic
        icon: layer
        sections:
          - name: Database
            icon: list
            default_open: true
            inputs:
              - name: identifier
              - name: database
              - name: db_name
              - name: username
              - name: agent
          - name: Sizing
            icon: list
            default_open: true
            inputs:
              - name: instance_class
              - name: allocated_storage
          - name: Network
            icon: list
            default_open: true
            inputs:
              - name: db_subnet_group_name
              - name: vpc_security_group_ids
              - name: multi_az
          - name: Tags
            icon: tags
            default_open: true
            inputs:
              - name: resource_tags
inputs:
  identifier:
    type: string
    description: Name/identifier of the DB instance (lowercase letters, numbers, hyphens; 1-63 chars). Becomes part of the endpoint hostname.
  database:
    type: string
    default: PostgreSQL 16
    description: Database engine and version. Maps internally to AWS engine + engine_version. Picking a major version lets AWS auto-pick the latest patched minor at deploy time.
    allowed-values:
      - PostgreSQL 16
      - PostgreSQL 15
      - MySQL 8.0
      - MariaDB 10.11
      - SQL Server 2022 Express
  db_name:
    type: string
    default: ''
    description: Name of the initial database created on the instance. Leave empty to skip initial database creation. Not used by SQL Server.
  username:
    type: string
    default: dbadmin
    description: "Master username. The master password is auto-generated and managed by AWS Secrets Manager \u2014 the secret ARN is exposed as an output. Cannot be \"admin\", \"root\", or other reserved\
      \ names."
  instance_class:
    type: string
    default: db.t3.micro
    description: RDS instance class. t3 = burstable (cost-effective for dev/test), m6i = general purpose, r6i = memory-optimized for OLAP workloads.
    allowed-values:
      - db.t3.micro
      - db.t3.small
      - db.t3.medium
      - db.t3.large
      - db.t3.xlarge
      - db.m6i.large
      - db.m6i.xlarge
      - db.m6i.2xlarge
      - db.r6i.large
      - db.r6i.xlarge
      - db.r6i.2xlarge
  allocated_storage:
    type: string
    default: '20'
    description: Initial GiB of storage. Minimum 20 for most engines, 100 for SQL Server. RDS storage auto-scaling is enabled with a 100 GiB ceiling by default.
  db_subnet_group_name:
    type: string
    description: Name of an existing DB subnet group that maps the VPC subnets where this instance can be placed. Use the AWS-RDS-DB-Subnet-Group blueprint to create one if you don't have it.
  vpc_security_group_ids:
    type: string
    default: 'null'
    description: JSON array of security group IDs to attach, e.g. ["sg-abc","sg-def"]. The SGs must belong to the same VPC as the db_subnet_group. Leave as "null" to use the VPC default SG.
  multi_az:
    type: string
    default: 'false'
    description: Deploy a synchronous standby in a second AZ for high availability. Doubles the cost. Recommended "true" for production workloads.
    allowed-values:
      - 'true'
      - 'false'
  resource_tags:
    type: string
    default: '{}'
    description: JSON map of tags to apply to the DB instance, e.g. {"Owner":"team-a","Env":"prod"}.
  agent:
    type: agent
outputs:
  db_instance_endpoint:
    value: '{{ .grains.db_instance.outputs.db_instance_endpoint }}'
    quick: true
  db_instance_address:
    value: '{{ .grains.db_instance.outputs.db_instance_address }}'
    quick: false
  db_instance_port:
    value: '{{ .grains.db_instance.outputs.db_instance_port }}'
    quick: false
  db_instance_arn:
    value: '{{ .grains.db_instance.outputs.db_instance_arn }}'
    quick: false
  db_instance_status:
    value: '{{ .grains.db_instance.outputs.db_instance_status }}'
    quick: false
  db_instance_identifier:
    value: '{{ .grains.db_instance.outputs.db_instance_identifier }}'
    quick: false
  db_instance_master_user_secret_arn:
    value: '{{ .grains.db_instance.outputs.db_instance_master_user_secret_arn }}'
    quick: true
grains:
  db_instance:
    kind: terraform
    tf-version: 1.5.7
    spec:
      source:
        store: AWS
        path: assets/terraform-aws-rds-db-instance
      agent:
        name: '{{ .inputs.agent }}'
      tags:
        auto-tag: true
      inputs:
        - identifier: '{{ .inputs.identifier }}'
        - engine: '{% case inputs.database %}{% when ''PostgreSQL 16'' %}postgres{% when ''PostgreSQL 15'' %}postgres{% when ''MySQL 8.0'' %}mysql{% when ''MariaDB 10.11'' %}mariadb{% when ''SQL Server
            2022 Express'' %}sqlserver-ex{% endcase %}'
        - engine_version: '{% case inputs.database %}{% when ''PostgreSQL 16'' %}16{% when ''PostgreSQL 15'' %}15{% when ''MySQL 8.0'' %}8.0{% when ''MariaDB 10.11'' %}10.11{% when ''SQL Server 2022 Express''
            %}16.00{% endcase %}'
        - port: '{% case inputs.database %}{% when ''PostgreSQL 16'' %}5432{% when ''PostgreSQL 15'' %}5432{% when ''MySQL 8.0'' %}3306{% when ''MariaDB 10.11'' %}3306{% when ''SQL Server 2022 Express''
            %}1433{% endcase %}'
        - license_model: '{% case inputs.database %}{% when ''SQL Server 2022 Express'' %}license-included{% else %}null{% endcase %}'
        - db_name: '{{ .inputs.db_name }}'
        - username: '{{ .inputs.username }}'
        - instance_class: '{{ .inputs.instance_class }}'
        - allocated_storage: '{{ .inputs.allocated_storage }}'
        - db_subnet_group_name: '{{ .inputs.db_subnet_group_name }}'
        - vpc_security_group_ids: '{{ .inputs.vpc_security_group_ids }}'
        - multi_az: '{{ .inputs.multi_az }}'
        - tags: '{{ .inputs.resource_tags }}'
        - storage_encrypted: 'true'
        - kms_key_id: 'null'
        - deletion_protection: 'true'
        - publicly_accessible: 'false'
        - iam_database_authentication_enabled: 'false'
        - skip_final_snapshot: 'false'
        - password: 'null'
        - manage_master_user_password: 'true'
        - manage_master_user_password_rotation: 'false'
        - master_user_secret_kms_key_id: 'null'
        - master_user_password_rotate_immediately: 'false'
        - master_user_password_rotation_automatically_after_days: '7'
        - master_user_password_rotation_duration: 2h
        - master_user_password_rotation_schedule_expression: 'null'
        - backup_retention_period: '7'
        - backup_window: 'null'
        - copy_tags_to_snapshot: 'true'
        - delete_automated_backups: 'false'
        - final_snapshot_identifier_prefix: final
        - apply_immediately: 'false'
        - maintenance_window: 'null'
        - auto_minor_version_upgrade: 'true'
        - allow_major_version_upgrade: 'false'
        - blue_green_update: '{}'
        - max_allocated_storage: '100'
        - storage_type: gp3
        - storage_throughput: 'null'
        - iops: 'null'
        - dedicated_log_volume: 'false'
        - performance_insights_enabled: 'false'
        - performance_insights_kms_key_id: 'null'
        - performance_insights_retention_period: '7'
        - monitoring_interval: '0'
        - create_monitoring_role: 'false'
        - monitoring_role_arn: 'null'
        - monitoring_role_description: 'null'
        - monitoring_role_name: 'null'
        - monitoring_role_permissions_boundary: 'null'
        - monitoring_role_use_name_prefix: 'true'
        - enabled_cloudwatch_logs_exports: '[]'
        - create_cloudwatch_log_group: 'false'
        - cloudwatch_log_group_class: STANDARD
        - cloudwatch_log_group_kms_key_id: 'null'
        - cloudwatch_log_group_retention_in_days: '30'
        - cloudwatch_log_group_skip_destroy: 'false'
        - domain: 'null'
        - domain_auth_secret_arn: 'null'
        - domain_dns_ips: '[]'
        - domain_fqdn: 'null'
        - domain_iam_role_name: 'null'
        - domain_ou: 'null'
        - ca_cert_identifier: 'null'
        - network_type: IPV4
        - availability_zone: 'null'
        - parameter_group_name: 'null'
        - option_group_name: 'null'
        - character_set_name: 'null'
        - nchar_character_set_name: 'null'
        - timezone: 'null'
        - snapshot_identifier: 'null'
        - replicate_source_db: 'null'
        - replica_mode: 'null'
        - restore_to_point_in_time: '{}'
        - s3_import: '{}'
        - custom_iam_instance_profile: 'null'
        - db_instance_tags: '{}'
        - create: 'true'
        - use_identifier_prefix: 'false'
        - timeouts: '{}'
      outputs:
        - db_instance_endpoint
        - db_instance_address
        - db_instance_port
        - db_instance_arn
        - db_instance_status
        - db_instance_identifier
        - db_instance_master_user_secret_arn
