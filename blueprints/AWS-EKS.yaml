spec_version: 2
description: Creates an Amazon EKS cluster control plane on AWS with KMS-encrypted secrets, OIDC for IRSA, and recommended logging. Worker compute is provisioned separately via the AWS-EKS-Managed-Node-Group-Module
  or AWS-Karpenter-for-EKS blueprints.
metadata:
  self-service: true
  display-name: AWS EKS Cluster
  icon:
    path: graphics/AWS EKS.svg
  blueprint-labels:
    - key: hypervisor
      value: AWS
    - key: category
      value: Cloud
    - key: Terraform
inputs:
  cluster_name:
    type: string
    description: Name of the EKS cluster (e.g. "platform-prod"). Used as the resource name and as a label for IAM/KMS/CloudWatch resources created alongside.
  vpc_id:
    type: string
    description: VPC where the cluster control plane ENIs and any auto-created security groups will live.
  subnet_ids:
    type: string
    description: JSON array of subnet IDs where worker nodes and the control plane ENIs will be placed, e.g. ["subnet-abc","subnet-def","subnet-ghi"]. Use at least two subnets in different AZs for HA.
  cluster_version:
    type: string
    default: '1.32'
    description: Kubernetes minor version. AWS EKS supports each version for ~14 months from GA; pick the newest one your platform tooling has tested.
    allowed-values:
      - '1.31'
      - '1.32'
      - '1.33'
      - '1.34'
  cluster_endpoint_public_access:
    type: string
    default: 'false'
    description: Expose the cluster API endpoint to the public internet. Keep "false" for prod-style clusters; set to "true" only for clusters you intend to reach from outside the VPC (and combine with
      cluster_endpoint_public_access_cidrs to restrict).
    allowed-values:
      - 'true'
      - 'false'
  enable_cluster_creator_admin_permissions:
    type: string
    default: 'true'
    description: Grant system:masters Kubernetes RBAC to the IAM principal launching this blueprint. With "true" you can kubectl from day one using AWS auth. Set "false" for CI/automation launches where
      the launcher should not be a permanent cluster admin.
    allowed-values:
      - 'true'
      - 'false'
  resource_tags:
    type: string
    default: '{}'
    description: JSON map of tags applied to the cluster and resources it creates (KMS key, CloudWatch log group, IAM role, etc.), e.g. {"Owner":"team-a","Env":"prod"}.
  agent:
    type: agent
outputs:
  cluster_id:
    value: '{{ .grains.terraform-aws-eks.outputs.cluster_id }}'
    quick: true
  cluster_arn:
    value: '{{ .grains.terraform-aws-eks.outputs.cluster_arn }}'
    quick: false
  cluster_endpoint:
    value: '{{ .grains.terraform-aws-eks.outputs.cluster_endpoint }}'
    quick: true
  cluster_certificate_authority_data:
    value: '{{ .grains.terraform-aws-eks.outputs.cluster_certificate_authority_data }}'
    quick: false
  cluster_oidc_issuer_url:
    value: '{{ .grains.terraform-aws-eks.outputs.cluster_oidc_issuer_url }}'
    quick: true
  cluster_security_group_id:
    value: '{{ .grains.terraform-aws-eks.outputs.cluster_security_group_id }}'
    quick: false
  oidc_provider_arn:
    value: '{{ .grains.terraform-aws-eks.outputs.oidc_provider_arn }}'
    quick: false
grains:
  terraform-aws-eks:
    kind: terraform
    tf-version: 1.5.7
    spec:
      source:
        store: AWS
        path: assets/terraform-aws-eks
      agent:
        name: '{{ .inputs.agent }}'
      tags:
        auto-tag: true
      inputs:
        - cluster_name: '{{ .inputs.cluster_name }}'
        - vpc_id: '{{ .inputs.vpc_id }}'
        - subnet_ids: '{{ .inputs.subnet_ids }}'
        - cluster_version: '{{ .inputs.cluster_version }}'
        - cluster_endpoint_public_access: '{{ .inputs.cluster_endpoint_public_access }}'
        - cluster_endpoint_public_access_cidrs: '[]'
        - enable_cluster_creator_admin_permissions: '{{ .inputs.enable_cluster_creator_admin_permissions }}'
        - tags: '{{ .inputs.resource_tags }}'
        - enable_irsa: 'true'
        - create_kms_key: 'true'
        - enable_kms_key_rotation: 'true'
        - attach_cluster_encryption_policy: 'true'
        - cluster_endpoint_private_access: 'true'
        - authentication_mode: API_AND_CONFIG_MAP
        - cluster_enabled_log_types: '["audit","api","authenticator"]'
        - create_cluster_security_group: 'true'
        - create_node_security_group: 'true'
        - cluster_security_group_id: 'null'
        - node_security_group_id: 'null'
        - cluster_additional_security_group_ids: '[]'
        - cluster_security_group_additional_rules: '{}'
        - cluster_security_group_description: EKS cluster security group
        - cluster_security_group_name: 'null'
        - cluster_security_group_tags: '{}'
        - cluster_security_group_use_name_prefix: 'true'
        - node_security_group_additional_rules: '{}'
        - node_security_group_description: EKS node shared security group
        - node_security_group_enable_recommended_rules: 'true'
        - node_security_group_name: 'null'
        - node_security_group_tags: '{}'
        - node_security_group_use_name_prefix: 'true'
        - create_iam_role: 'true'
        - iam_role_additional_policies: '{}'
        - iam_role_arn: 'null'
        - iam_role_description: 'null'
        - iam_role_name: 'null'
        - iam_role_path: 'null'
        - iam_role_permissions_boundary: 'null'
        - iam_role_tags: '{}'
        - iam_role_use_name_prefix: 'true'
        - create_cloudwatch_log_group: 'true'
        - cloudwatch_log_group_class: STANDARD
        - cloudwatch_log_group_kms_key_id: 'null'
        - cloudwatch_log_group_retention_in_days: '90'
        - cloudwatch_log_group_tags: '{}'
        - cluster_encryption_config: '{"resources":["secrets"]}'
        - cluster_encryption_policy_description: EKS cluster encryption policy
        - cluster_encryption_policy_name: 'null'
        - cluster_encryption_policy_path: 'null'
        - cluster_encryption_policy_tags: '{}'
        - cluster_encryption_policy_use_name_prefix: 'true'
        - kms_key_administrators: '[]'
        - kms_key_aliases: '[]'
        - kms_key_deletion_window_in_days: '30'
        - kms_key_description: EKS secret encryption key
        - kms_key_enable_default_policy: 'true'
        - kms_key_override_policy_documents: '[]'
        - kms_key_owners: '[]'
        - kms_key_service_users: '[]'
        - kms_key_source_policy_documents: '[]'
        - kms_key_users: '[]'
        - eks_managed_node_group_defaults: '{}'
        - eks_managed_node_groups: '{}'
        - fargate_profile_defaults: '{}'
        - fargate_profiles: '{}'
        - self_managed_node_group_defaults: '{}'
        - self_managed_node_groups: '{}'
        - cluster_addons: '{}'
        - cluster_addons_timeouts: '{}'
        - access_entries: '{}'
        - cluster_identity_providers: '{}'
        - cluster_ip_family: ipv4
        - cluster_service_ipv4_cidr: 'null'
        - cluster_service_ipv6_cidr: 'null'
        - create_cni_ipv6_iam_policy: 'false'
        - create_cluster_primary_security_group_tags: 'true'
        - custom_oidc_thumbprints: '[]'
        - enable_efa_support: 'false'
        - include_oidc_root_ca_thumbprint: 'true'
        - openid_connect_audiences: '[]'
        - outpost_config: '{}'
        - create: 'true'
        - cluster_tags: '{}'
        - cluster_timeouts: '{}'
        - control_plane_subnet_ids: '[]'
        - dataplane_wait_duration: 30s
        - prefix_separator: '-'
        - putin_khuylo: 'true'
      outputs:
        - cluster_id
        - cluster_arn
        - cluster_endpoint
        - cluster_certificate_authority_data
        - cluster_oidc_issuer_url
        - cluster_security_group_id
        - oidc_provider_arn
