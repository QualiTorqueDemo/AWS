spec_version: 2
description: Sets up AWS CodeDeploy to perform blue/green deployments of a Lambda function alias. Pick a deployment strategy (all-at-once, canary, linear) and CodeDeploy manages the traffic shift between
  function versions.
metadata:
  self-service: true
  display-name: AWS Lambda with CodeDeploy
  icon:
    path: graphics/AWS Lambda.svg
  blueprint-labels:
    - key: hypervisor
      value: AWS
      initial-color: aws
    - key: category
      value: Cloud
      initial-color: teal
    - key: Terraform
      initial-color: pink
inputs:
  function_name:
    type: string
    description: Name of the existing Lambda function to deploy.
  alias_name:
    type: string
    default: live
    description: Lambda alias that CodeDeploy will shift traffic on (e.g. "live", "prod"). Must already exist.
  current_version:
    type: string
    description: Lambda version number the alias currently points to (the "from" side of the shift).
  target_version:
    type: string
    description: Lambda version number to shift traffic to.
  deployment_config_name:
    type: string
    default: CodeDeployDefault.LambdaAllAtOnce
    description: Built-in CodeDeploy deployment strategy. Canary = shift X% then wait, then 100%. Linear = shift X% every N minutes.
    allowed-values:
      - CodeDeployDefault.LambdaAllAtOnce
      - CodeDeployDefault.LambdaCanary10Percent5Minutes
      - CodeDeployDefault.LambdaCanary10Percent15Minutes
      - CodeDeployDefault.LambdaCanary10Percent30Minutes
      - CodeDeployDefault.LambdaLinear10PercentEvery1Minute
      - CodeDeployDefault.LambdaLinear10PercentEvery2Minutes
      - CodeDeployDefault.LambdaLinear10PercentEvery3Minutes
      - CodeDeployDefault.LambdaLinear10PercentEvery10Minutes
  resource_tags:
    type: string
    default: '{}'
    description: JSON map of tags applied to created CodeDeploy app / deployment group / IAM role.
  agent:
    type: agent
outputs:
  codedeploy_app_name:
    value: '{{ .grains.deploy.outputs.codedeploy_app_name }}'
    quick: true
  codedeploy_deployment_group_name:
    value: '{{ .grains.deploy.outputs.codedeploy_deployment_group_name }}'
    quick: false
grains:
  deploy:
    kind: terraform
    spec:
      source:
        store: AWS
        path: assets/terraform-aws-lambda-deploy
      agent:
        name: '{{ .inputs.agent }}'
      tags:
        auto-tag: true
      inputs:
        - function_name: '{{ .inputs.function_name }}'
        - alias_name: '{{ .inputs.alias_name }}'
        - current_version: '{{ .inputs.current_version }}'
        - target_version: '{{ .inputs.target_version }}'
        - deployment_config_name: '{{ .inputs.deployment_config_name }}'
        - auto_rollback_enabled: 'true'
        - tags: '{{ .inputs.resource_tags }}'
        - app_name: 'null'
        - after_allow_traffic_hook_arn: 'null'
        - alarm_enabled: 'false'
        - alarm_ignore_poll_alarm_failure: 'false'
        - alarms: '[]'
        - attach_hooks_policy: 'false'
        - attach_triggers_policy: 'false'
        - auto_rollback_events: '["DEPLOYMENT_FAILURE"]'
        - aws_cli_command: aws
        - before_allow_traffic_hook_arn: 'null'
        - codedeploy_principals: '["codedeploy.amazonaws.com"]'
        - codedeploy_role_name: 'null'
        - create: 'true'
        - create_app: 'true'
        - create_codedeploy_role: 'true'
        - create_deployment: 'true'
        - create_deployment_group: 'true'
        - deployment_group_name: 'null'
        - description: 'null'
        - force_deploy: 'false'
        - get_deployment_sleep_timer: '5'
        - interpreter: '["/bin/sh","-c"]'
        - run_deployment: 'true'
        - save_deploy_script: 'false'
        - triggers: '{}'
        - use_existing_app: 'false'
        - use_existing_deployment_group: 'false'
        - wait_deployment_completion: 'true'
      outputs:
        - codedeploy_app_name
        - codedeploy_deployment_group_name
    tf-version: 1.15.1
