spec_version: 2
description: Creates an AWS Secrets Manager secret with KMS encryption. Use for storing API keys, DB passwords, OAuth tokens, etc.
metadata:
  self-service: true
  display-name: AWS Secrets Manager
  icon:
    path: graphics/Secrets Manager.svg
  blueprint-labels:
    - key: hypervisor
      value: AWS
      initial-color: aws
    - key: category
      value: Cloud
      initial-color: teal
    - key: Terraform
      initial-color: pink
inputs:
  name:
    type: string
    description: Name of the secret. Must be unique within the AWS region.
  description:
    type: string
    default: Managed by Torque
    description: Free-text description shown in the AWS console.
  secret_string:
    type: string
    default: ''
    description: "Plaintext secret value. Marked sensitive \u2014 Torque hides it in logs and the launch-form audit. For production: leave empty and set the value out-of-band via a separate workflow using\
      \ `aws secretsmanager put-secret-value`, so the secret never enters Torque state at all."
    sensitive: true
  recovery_window_in_days:
    type: string
    default: '30'
    description: Days before a deleted secret is permanently destroyed. 0 = immediate destroy, 7-30 = scheduled (recommended 7 for dev, 30 for prod).
    allowed-values:
      - '0'
      - '7'
      - '14'
      - '21'
      - '30'
  resource_tags:
    type: string
    default: '{}'
    description: JSON map of tags applied to the secret.
  agent:
    type: agent
outputs:
  secret_arn:
    value: '{{ .grains.secret.outputs.secret_arn }}'
    quick: true
  secret_id:
    value: '{{ .grains.secret.outputs.secret_id }}'
    quick: false
  secret_name:
    value: '{{ .grains.secret.outputs.secret_name }}'
    quick: false
grains:
  secret:
    kind: terraform
    tf-version: 1.15.1
    spec:
      source:
        store: AWS
        path: assets/terraform-aws-secrets-manager
      agent:
        name: '{{ .inputs.agent }}'
      tags:
        auto-tag: true
      inputs:
        - name: '{{ .inputs.name }}'
        - description: '{{ .inputs.description }}'
        - secret_string: '{{ .inputs.secret_string }}'
        - recovery_window_in_days: '{{ .inputs.recovery_window_in_days }}'
        - tags: '{{ .inputs.resource_tags }}'
        - create: 'true'
        - region: 'null'
        - force_overwrite_replica_secret: 'false'
        - kms_key_id: 'null'
        - name_prefix: 'null'
        - replica: '{}'
        - create_policy: 'false'
        - source_policy_documents: '[]'
        - override_policy_documents: '[]'
        - policy_statements: '{}'
        - block_public_policy: 'false'
        - ignore_secret_changes: 'false'
        - secret_binary: 'null'
        - secret_string_wo: 'null'
        - secret_string_wo_version: 'null'
        - version_stages: '[]'
        - create_random_password: 'false'
        - random_password_length: '32'
        - random_password_override_special: '!#$%&*()-_=+[]{}<>:?'
        - enable_rotation: 'false'
        - rotate_immediately: 'true'
        - rotation_lambda_arn: 'null'
        - rotation_rules: 'null'
      outputs:
        - secret_arn
        - secret_id
        - secret_name
