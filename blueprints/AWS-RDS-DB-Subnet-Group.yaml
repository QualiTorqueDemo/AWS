spec_version: 2
description: Creates an RDS DB subnet group, which determines which VPC subnets RDS / Aurora instances can be placed in.
metadata:
  self-service: true
  display-name: AWS RDS DB Subnet Group
  icon:
    path: graphics/RDS DB.svg
  blueprint-labels:
    - key: hypervisor
      value: AWS
      initial-color: orange
    - key: category
      value: Cloud
      initial-color: teal
    - key: Terraform
      initial-color: pink
inputs:
  name:
    type: string
    description: DB subnet group name (1-255 chars).
  subnet_ids:
    type: string
    description: JSON array of subnet IDs, e.g. ["subnet-abc","subnet-def"]. Use at least two subnets in different AZs for multi-AZ RDS.
  description:
    type: string
    default: DB subnet group managed by Torque
    description: Free-text description.
  resource_tags:
    type: string
    default: '{}'
    description: JSON map of tags applied to the subnet group.
  agent:
    type: agent
outputs:
  db_subnet_group_id:
    value: '{{ .grains.db_subnet_group.outputs.db_subnet_group_id }}'
    quick: true
grains:
  db_subnet_group:
    kind: terraform
    spec:
      source:
        store: AWS
        path: assets/terraform-aws-rds-db-subnet-group
      agent:
        name: '{{ .inputs.agent }}'
      tags:
        auto-tag: true
      inputs:
        - name: '{{ .inputs.name }}'
        - subnet_ids: '{{ .inputs.subnet_ids }}'
        - description: '{{ .inputs.description }}'
        - tags: '{{ .inputs.resource_tags }}'
        - create: 'true'
        - use_name_prefix: 'false'
      outputs:
        - db_subnet_group_id
    tf-version: 1.5.7
