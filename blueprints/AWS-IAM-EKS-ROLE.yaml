spec_version: 2
description: Creates an IAM role assumable by a Kubernetes ServiceAccount on an EKS cluster (IRSA). Pass the resulting role ARN as the eks.amazonaws.com/role-arn annotation on the SA.
metadata:
  self-service: true
  display-name: AWS IAM EKS Role
  icon:
    path: graphics/AWS IAM.svg
  blueprint-labels:
    - key: hypervisor
      value: AWS
      initial-color: aws
    - key: category
      value: Cloud
      initial-color: teal
    - key: Terraform
      initial-color: pink
inputs:
  role_name:
    type: string
    description: Name of the IAM role to create.
  cluster_service_accounts:
    type: string
    description: 'JSON map of EKS cluster -> list of "namespace:serviceaccount" pairs allowed to assume this role, e.g. {"my-cluster": ["default:my-app","kube-system:external-dns"]}.'
  role_policy_arns:
    type: string
    default: '{}'
    description: 'JSON map of key -> policy ARN attached to the role, e.g. {"s3": "arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess"}.'
  role_description:
    type: string
    default: EKS service account role
    description: Free-text description.
  resource_tags:
    type: string
    default: '{}'
    description: JSON map of tags applied to the IAM role.
  agent:
    type: agent
outputs:
  iam_role_arn:
    value: '{{ .grains.iam-eks-role.outputs.iam_role_arn }}'
    quick: true
grains:
  iam-eks-role:
    kind: terraform
    spec:
      source:
        store: AWS
        path: assets/terraform-aws-iam-eks-role
      agent:
        name: '{{ .inputs.agent }}'
      tags:
        auto-tag: true
      inputs:
        - role_name: '{{ .inputs.role_name }}'
        - cluster_service_accounts: '{{ .inputs.cluster_service_accounts }}'
        - role_policy_arns: '{{ .inputs.role_policy_arns }}'
        - role_description: '{{ .inputs.role_description }}'
        - tags: '{{ .inputs.resource_tags }}'
        - allow_self_assume_role: 'false'
        - assume_role_condition_test: StringEquals
        - create_role: 'true'
        - force_detach_policies: 'false'
        - max_session_duration: '3600'
        - role_name_prefix: 'null'
        - role_path: /
        - role_permissions_boundary_arn: 'null'
      outputs:
        - iam_role_arn
    tf-version: 1.5.7
