spec_version: 2
description: Creates an AWS IAM managed policy from a JSON document.
metadata:
  self-service: true
  display-name: AWS IAM Policy
  icon:
    path: graphics/AWS IAM.svg
  blueprint-labels:
    - key: hypervisor
      value: AWS
    - key: category
      value: Cloud
    - key: Terraform
inputs:
  name:
    type: string
    description: Policy name (1-128 chars).
  policy:
    type: string
    description: 'IAM policy JSON document, e.g. {"Version": "2012-10-17", "Statement": [{"Effect": "Allow", "Action": "s3:Get*", "Resource": "*"}]}.'
  description:
    type: string
    default: IAM policy managed by Torque
    description: Free-text description.
  resource_tags:
    type: string
    default: '{}'
    description: JSON map of tags applied to the policy.
  agent:
    type: agent
outputs:
  arn:
    value: '{{ .grains.iam-policy.outputs.arn }}'
    quick: true
  id:
    value: '{{ .grains.iam-policy.outputs.id }}'
    quick: false
  name:
    value: '{{ .grains.iam-policy.outputs.name }}'
    quick: false
  path:
    value: '{{ .grains.iam-policy.outputs.path }}'
    quick: false
grains:
  iam-policy:
    kind: terraform
    spec:
      source:
        store: AWS
        path: assets/terraform-aws-iam-policy
      agent:
        name: '{{ .inputs.agent }}'
      tags:
        auto-tag: true
      inputs:
        - name: '{{ .inputs.name }}'
        - policy: '{{ .inputs.policy }}'
        - description: '{{ .inputs.description }}'
        - tags: '{{ .inputs.resource_tags }}'
        - create_policy: 'true'
        - name_prefix: 'null'
        - path: /
      outputs:
        - arn
        - id
        - name
        - path
    tf-version: 1.5.7
