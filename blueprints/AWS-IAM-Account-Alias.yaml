spec_version: 2
description: Sets the AWS account alias (the human-readable name shown on the sign-in page) and applies a hardened IAM password policy to the account.
metadata:
  self-service: true
  display-name: AWS IAM Account Alias
  icon:
    path: graphics/AWS IAM.svg
  blueprint-labels:
    - key: hypervisor
      value: AWS
      initial-color: aws
    - key: category
      value: Cloud
      initial-color: teal
    - key: Terraform
      initial-color: pink
inputs:
  account_alias:
    type: string
    description: 'Account-level alias (3-63 lowercase chars, digits, hyphens). Becomes part of the sign-in URL: https://<alias>.signin.aws.amazon.com/console.'
  agent:
    type: agent
outputs:
  account_id:
    value: '{{ .grains.iam-account.outputs.caller_identity_account_id }}'
    quick: true
grains:
  iam-account:
    kind: terraform
    spec:
      source:
        store: AWS
        path: assets/terraform-aws-iam-account
      agent:
        name: '{{ .inputs.agent }}'
      tags:
        auto-tag: true
      inputs:
        - account_alias: '{{ .inputs.account_alias }}'
        - get_caller_identity: 'true'
        - create_account_password_policy: 'true'
        - allow_users_to_change_password: 'true'
        - hard_expiry: 'false'
        - max_password_age: '90'
        - minimum_password_length: '14'
        - password_reuse_prevention: '24'
        - require_lowercase_characters: 'true'
        - require_numbers: 'true'
        - require_symbols: 'true'
        - require_uppercase_characters: 'true'
      outputs:
        - caller_identity_account_id
    tf-version: 1.5.7
