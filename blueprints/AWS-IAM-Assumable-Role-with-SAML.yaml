spec_version: 2
description: Creates an IAM role that can be assumed via a SAML 2.0 identity provider (e.g. Okta, Azure AD, Google Workspace SSO into AWS).
metadata:
  self-service: true
  display-name: AWS IAM Assumable Role with SAML
  icon:
    path: graphics/AWS IAM.svg
  blueprint-labels:
    - key: hypervisor
      value: AWS
      initial-color: aws
    - key: category
      value: Cloud
      initial-color: teal
    - key: Terraform
      initial-color: pink
inputs:
  role_name:
    type: string
    description: Name of the IAM role to create.
  provider_id:
    type: string
    description: ARN of the existing SAML provider in IAM, e.g. arn:aws:iam::123456789012:saml-provider/Okta.
  role_policy_arns:
    type: string
    default: '[]'
    description: JSON array of IAM policy ARNs to attach to the role.
  resource_tags:
    type: string
    default: '{}'
    description: JSON map of tags applied to the IAM role.
  agent:
    type: agent
outputs:
  iam_role_arn:
    value: '{{ .grains.iam-assumable-role-with-saml.outputs.iam_role_arn }}'
    quick: true
grains:
  iam-assumable-role-with-saml:
    kind: terraform
    spec:
      source:
        store: AWS
        path: assets/terraform-aws-iam-assumable-role-with-saml
      agent:
        name: '{{ .inputs.agent }}'
      tags:
        auto-tag: true
      inputs:
        - role_name: '{{ .inputs.role_name }}'
        - provider_id: '{{ .inputs.provider_id }}'
        - role_policy_arns: '{{ .inputs.role_policy_arns }}'
        - tags: '{{ .inputs.resource_tags }}'
        - allow_self_assume_role: 'false'
        - aws_saml_endpoint: https://signin.aws.amazon.com/saml
        - create_role: 'true'
        - force_detach_policies: 'false'
        - max_session_duration: '3600'
        - number_of_role_policy_arns: 'null'
        - provider_ids: '[]'
        - role_description: 'null'
        - role_name_prefix: 'null'
        - role_path: /
        - role_permissions_boundary_arn: 'null'
        - trusted_role_actions: '["sts:AssumeRoleWithSAML"]'
      outputs:
        - iam_role_arn
    tf-version: 1.5.7
