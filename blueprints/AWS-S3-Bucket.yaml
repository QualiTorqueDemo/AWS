spec_version: 2
description: |
  Provisions an AWS S3 bucket with the following capabilities:
  - Static web-site hosting
  - Versioning
  - Server-side encryption
  - Lifecycle rules
  - CORS
metadata:
  self-service: true
  display-name: AWS S3 Bucket
  icon:
    path: graphics/S3 Bucket.svg
  blueprint-labels:
    - key: hypervisor
      value: AWS
    - key: category
      value: Cloud
    - key: Terraform
inputs:
  bucket_name:
    type: string
    default: 'null'
    description: Globally unique name for the S3 bucket. Leave empty to let Terraform generate one.
  versioning_enabled:
    type: string
    default: 'true'
    description: Enable S3 bucket versioning
    allowed-values:
      - 'true'
      - 'false'
  force_destroy:
    type: string
    default: 'false'
    description: Allow the bucket to be destroyed even when it contains objects. Set to true only for non-production buckets.
    allowed-values:
      - 'true'
      - 'false'
  resource_tags:
    type: string
    default: '{}'
    description: Additional tags to apply to the bucket (JSON map, e.g. {"team":"platform","env":"prod"})
  agent:
    type: agent
outputs:
  complete_s3_bucket_website_domain:
    value: 'http://{{ .grains.complete_s3_bucket.outputs.s3_bucket_website_domain }}'
    quick: true
    kind: link
  complete_s3_bucket_website_endpoint:
    value: 'http://{{ .grains.complete_s3_bucket.outputs.s3_bucket_website_endpoint }}'
    quick: true
    kind: link
  complete_s3_bucket_arn:
    value: '{{ .grains.complete_s3_bucket.outputs.s3_bucket_arn }}'
    quick: true
  complete_s3_bucket_bucket_domain_name:
    value: '{{ .grains.complete_s3_bucket.outputs.s3_bucket_bucket_domain_name }}'
    quick: true
  complete_s3_bucket_bucket_regional_domain_name:
    value: '{{ .grains.complete_s3_bucket.outputs.s3_bucket_bucket_regional_domain_name }}'
    quick: true
  complete_s3_bucket_hosted_zone_id:
    value: '{{ .grains.complete_s3_bucket.outputs.s3_bucket_hosted_zone_id }}'
    quick: true
  complete_s3_bucket_id:
    value: '{{ .grains.complete_s3_bucket.outputs.s3_bucket_id }}'
    quick: true
  complete_s3_bucket_lifecycle_configuration_rules:
    value: '{{ .grains.complete_s3_bucket.outputs.s3_bucket_lifecycle_configuration_rules }}'
    quick: true
  complete_s3_bucket_policy:
    value: '{{ .grains.complete_s3_bucket.outputs.s3_bucket_policy }}'
    quick: true
  complete_s3_bucket_region:
    value: '{{ .grains.complete_s3_bucket.outputs.s3_bucket_region }}'
    quick: true
grains:
  complete_s3_bucket:
    kind: terraform
    tf-version: 1.5.5
    spec:
      source:
        store: AWS
        path: assets/terraform-aws-s3-bucket
      agent:
        name: '{{ .inputs.agent }}'
      tags:
        auto-tag: true
      inputs:
        - bucket: '{{ .inputs.bucket_name }}'
        - versioning: '{{ .inputs.versioning_enabled }}'
        - force_destroy: '{{ .inputs.force_destroy }}'
        - tags: '{{ .inputs.resource_tags }}'
      outputs:
        - s3_bucket_arn
        - s3_bucket_bucket_domain_name
        - s3_bucket_bucket_regional_domain_name
        - s3_bucket_hosted_zone_id
        - s3_bucket_id
        - s3_bucket_lifecycle_configuration_rules
        - s3_bucket_policy
        - s3_bucket_region
        - s3_bucket_website_domain
        - s3_bucket_website_endpoint
