spec_version: 2
description: Creates an Amazon S3 bucket with versioning enabled.
metadata:
  self-service: true
  display-name: AWS S3 Bucket
  icon:
    path: graphics/S3 Bucket.svg
  blueprint-labels:
    - key: hypervisor
      value: AWS
      initial-color: '#FF9900'
    - key: category
      value: Cloud
      initial-color: '#1E88E5'
    - key: Terraform
      initial-color: '#7B42BC'
inputs:
  bucket_name:
    type: string
    default: 'null'
    description: Globally-unique S3 bucket name. Leave as "null" to auto-generate one based on a random pet name.
  versioning_enabled:
    type: string
    default: 'true'
    description: Keep all versions of every object. Strongly recommended for production data.
    allowed-values:
      - 'true'
      - 'false'
  force_destroy:
    type: string
    default: 'false'
    description: If "true", terraform destroy deletes all objects in the bucket before deleting the bucket itself. Convenient for dev/test, dangerous for prod.
    allowed-values:
      - 'true'
      - 'false'
  resource_tags:
    type: string
    default: '{}'
    description: JSON map of tags applied to the bucket.
  agent:
    type: agent
outputs:
  id:
    value: '{{ .grains.complete_s3_bucket.outputs.s3_bucket_id }}'
    quick: true
  bucket_regional_domain_name:
    value: '{{ .grains.complete_s3_bucket.outputs.s3_bucket_bucket_regional_domain_name }}'
    quick: false
grains:
  complete_s3_bucket:
    kind: terraform
    tf-version: 1.5.7
    spec:
      source:
        store: AWS
        path: assets/terraform-aws-s3-bucket
      agent:
        name: '{{ .inputs.agent }}'
      tags:
        auto-tag: true
      inputs:
        - bucket_name: '{{ .inputs.bucket_name }}'
        - versioning_enabled: '{{ .inputs.versioning_enabled }}'
        - force_destroy: '{{ .inputs.force_destroy }}'
        - resource_tags: '{{ .inputs.resource_tags }}'
      outputs:
        - s3_bucket_id
        - s3_bucket_bucket_regional_domain_name
