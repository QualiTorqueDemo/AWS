spec_version: 2
description: Deploys an AWS EKS cluster and an attached Managed Node Group in a single environment. Use this for end-to-end EKS testing (including the AWS-EKS-Upgrade workflow). For production, prefer launching the cluster and node groups as separate environments so node group rolls don't trigger cluster re-converge.
metadata:
  self-service: true
  display-name: AWS EKS + Managed Node Group
  icon:
    path: graphics/AWS EKS.svg
  blueprint-labels:
    - key: hypervisor
      value: AWS
      initial-color: aws
    - key: category
      value: Cloud
      initial-color: teal
    - key: Terraform
      initial-color: pink
inputs:
  cluster_name:
    type: string
    description: Name of the EKS cluster (e.g. "platform-test"). The node group attaches to this cluster.
  vpc_id:
    type: string
    description: VPC where the cluster control plane ENIs and worker nodes will live.
  subnet_id_1:
    type: string
    description: First subnet ID. EKS requires at least 2 subnets across 2 different AZs for the control plane.
  subnet_id_2:
    type: string
    description: Second subnet ID. Must be in a different AZ from subnet_id_1.
  subnet_id_3:
    type: string
    default: ''
    description: Third subnet ID (optional). Leave blank if not needed.
  subnet_id_4:
    type: string
    default: ''
    description: Fourth subnet ID (optional). Leave blank if not needed.
  cluster_version:
    type: string
    default: '1.34'
    description: Kubernetes minor version for the EKS control plane. Pick one minor below the latest if you plan to test the AWS-EKS-Upgrade workflow against this env.
    allowed-values:
      - '1.35'
      - '1.34'
      - '1.33'
      - '1.32'
  nodegroup_name:
    type: string
    default: default-ng
    description: Node group name (1-63 chars). Appears in the EKS console alongside the cluster.
  instance_type:
    type: string
    default: t3.medium
    description: EC2 instance type for worker nodes.
    allowed-values:
      - t3.medium
      - t3.large
      - t3.xlarge
      - m6i.large
      - m6i.xlarge
      - c6i.large
      - c6i.xlarge
      - r6i.large
  capacity_type:
    type: string
    default: ON_DEMAND
    description: Pricing model for node group capacity.
    allowed-values:
      - ON_DEMAND
      - SPOT
  desired_size:
    type: string
    default: '2'
    description: Target number of worker nodes.
  min_size:
    type: string
    default: '1'
    description: Minimum number of nodes the autoscaler will keep running.
  max_size:
    type: string
    default: '3'
    description: Maximum number of nodes the autoscaler can grow to.
  disk_size:
    type: string
    default: '50'
    description: Root EBS volume size per node, in GiB.
  resource_tags:
    type: string
    default: '{}'
    description: JSON map of tags applied to both the cluster and the node group, e.g. {"Owner":"team-a","Env":"test"}.
  agent:
    type: agent
outputs:
  cluster_name:
    value: '{{ .grains.eks_cluster.outputs.cluster_name }}'
    quick: true
  cluster_endpoint:
    value: '{{ .grains.eks_cluster.outputs.cluster_endpoint }}'
    quick: true
  cluster_arn:
    value: '{{ .grains.eks_cluster.outputs.cluster_arn }}'
    quick: false
  node_group_id:
    value: '{{ .grains.nodegroup.outputs.node_group_id }}'
    quick: true
grains:
  eks_cluster:
    kind: blueprint
    spec:
      source:
        store: AWS
        path: blueprints/AWS-EKS.yaml
      inputs:
        - cluster_name: '{{ .inputs.cluster_name }}'
        - vpc_id: '{{ .inputs.vpc_id }}'
        - subnet_id_1: '{{ .inputs.subnet_id_1 }}'
        - subnet_id_2: '{{ .inputs.subnet_id_2 }}'
        - subnet_id_3: '{{ .inputs.subnet_id_3 }}'
        - subnet_id_4: '{{ .inputs.subnet_id_4 }}'
        - cluster_version: '{{ .inputs.cluster_version }}'
        - resource_tags: '{{ .inputs.resource_tags }}'
        - agent: '{{ .inputs.agent }}'
      outputs:
        - cluster_name
        - cluster_endpoint
        - cluster_arn
        - subnet_ids
  nodegroup:
    depends-on: eks_cluster
    kind: blueprint
    spec:
      source:
        store: AWS
        path: blueprints/AWS-EKS-Managed-Node-Group-Module.yaml
      inputs:
        - cluster_name: '{{ .grains.eks_cluster.outputs.cluster_name }}'
        - name: '{{ .inputs.nodegroup_name }}'
        - subnet_id_1: '{{ .inputs.subnet_id_1 }}'
        - subnet_id_2: '{{ .inputs.subnet_id_2 }}'
        - subnet_id_3: '{{ .inputs.subnet_id_3 }}'
        - subnet_id_4: '{{ .inputs.subnet_id_4 }}'
        - instance_type: '{{ .inputs.instance_type }}'
        - capacity_type: '{{ .inputs.capacity_type }}'
        - desired_size: '{{ .inputs.desired_size }}'
        - min_size: '{{ .inputs.min_size }}'
        - max_size: '{{ .inputs.max_size }}'
        - disk_size: '{{ .inputs.disk_size }}'
        - resource_tags: '{{ .inputs.resource_tags }}'
        - agent: '{{ .inputs.agent }}'
      outputs:
        - node_group_id
        - iam_role_arn
