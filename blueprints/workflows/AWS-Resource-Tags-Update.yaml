spec_version: 2
description: Add or remove AWS resource tags on a selected resource. Works across any AWS resource that exposes an ARN (EC2, RDS, S3, EKS, Lambda, ECR, Secrets Manager, CloudWatch, App Runner) using the unified Resource Groups Tagging API.
metadata:
  self-service: false
  display-name: AWS Resource Tags Update (Shell)
  icon:
    path: graphics/AWS-Dark.svg
  blueprint-labels:
    - key: hypervisor
      value: AWS
      initial-color: aws
    - key: category
      value: Cloud
      initial-color: teal
    - key: Shell
      initial-color: frogGreen
workflow:
  scope: env_resource
  resource-types: aws_instance,aws_db_instance,aws_rds_cluster,aws_s3_bucket,aws_eks_cluster,aws_lambda_function,aws_ecr_repository,aws_secretsmanager_secret,aws_cloudwatch_log_group,aws_apprunner_service,aws_security_group
  labels-selector: hypervisor:AWS
  triggers:
    - type: manual
  timeout: '10'
inputs:
  agent:
    type: agent
  action:
    type: string
    default: add_tags
    description: add_tags merges the provided tags into the resource (existing keys are overwritten). remove_tags strips the listed keys from the resource.
    allowed-values:
      - add_tags
      - remove_tags
  tags:
    type: string
    description: 'For add_tags: comma-separated key=value pairs, e.g. Owner=alice,Env=prod,CostCenter=123. For remove_tags: just comma-separated keys, e.g. Owner,Env. Spaces around keys/values are trimmed. Keys cannot contain = or , and values cannot contain ,.'
outputs:
  resource_arn:
    value: '{{ .grains.tag_update.activities.deploy.commands.tag.outputs.resource_arn }}'
    quick: true
  region:
    value: '{{ .grains.tag_update.activities.deploy.commands.tag.outputs.region }}'
    quick: true
  action_taken:
    value: '{{ .grains.tag_update.activities.deploy.commands.tag.outputs.action_taken }}'
    quick: true
  tags_keys:
    value: '{{ .grains.tag_update.activities.deploy.commands.tag.outputs.tags_keys }}'
    quick: true
grains:
  tag_update:
    kind: shell
    spec:
      agent:
        name: '{{ .inputs.agent }}'
      activities:
        deploy:
          commands:
            - name: tag
              command: |
                set -euo pipefail

                rid="{{ .bindings.resource_id }}"
                gpath="{{ .bindings.grain_path }}"
                contract="$CONTRACT_FILE_PATH"
                action="{{ .inputs.action }}"
                tags_in='{{ .inputs.tags }}'

                resource_arn=$(jq -r --arg ResourceId "$rid" --arg GrainPath "$gpath" \
                  '.resources[]
                    | select(.identifier == $ResourceId and .grain_path == $GrainPath)
                    | (.attributes.arn // .attributes.ARN // empty)' \
                  "$contract")

                region=$(jq -r --arg ResourceId "$rid" --arg GrainPath "$gpath" \
                  '.resources[]
                    | select(.identifier == $ResourceId and .grain_path == $GrainPath)
                    | (.attributes.region // .attributes.aws_region // empty)' \
                  "$contract")

                # S3 buckets do not store a true region attribute; fall back to environment
                if [ -z "${region:-}" ]; then
                  region="${AWS_DEFAULT_REGION:-${AWS_REGION:-}}"
                fi

                if [ -z "${resource_arn:-}" ]; then
                  echo "ERROR: Failed to extract resource ARN from contract.json (resource_id=$rid, grain_path=$gpath)."
                  echo "The selected resource type may not expose .attributes.arn - extend this workflow if needed."
                  exit 1
                fi
                if [ -z "${region:-}" ]; then
                  echo "ERROR: Failed to determine AWS region for the selected resource."
                  exit 1
                fi

                echo "Target: arn=$resource_arn region=$region action=$action"
                echo "Input: tags='$tags_in'"

                if [ -z "${tags_in:-}" ]; then
                  echo "ERROR: 'tags' input is empty."
                  exit 1
                fi

                if [ "$action" = "add_tags" ]; then
                  # Expect: key1=value1,key2=value2 (CSV of key=value pairs)
                  # Validate every comma-separated chunk contains exactly one '='
                  if ! printf '%s' "$tags_in" | awk -v RS=',' '
                    {
                      gsub(/^[ \t]+|[ \t]+$/, "")
                      if (length($0) == 0) { bad=1; exit }
                      n = gsub(/=/, "=")
                      if (n != 1) { bad=1; exit }
                      split($0, parts, "=")
                      if (length(parts[1]) == 0) { bad=1; exit }
                    }
                    END { if (bad) exit 1 }
                  '; then
                    echo "ERROR: tags input is not in 'key=value,key=value' format."
                    echo "       You provided: '$tags_in'"
                    echo "       Example: Owner=alice,Env=prod"
                    exit 1
                  fi

                  # Build JSON map for AWS CLI --tags
                  tags_json=$(printf '%s' "$tags_in" | awk -v RS=',' '
                    BEGIN { printf "{" }
                    {
                      gsub(/^[ \t]+|[ \t]+$/, "")
                      eq = index($0, "=")
                      key = substr($0, 1, eq - 1)
                      val = substr($0, eq + 1)
                      gsub(/^[ \t]+|[ \t]+$/, "", key)
                      gsub(/^[ \t]+|[ \t]+$/, "", val)
                      if (NR > 1) printf ","
                      gsub(/"/, "\\\"", val)
                      printf "\"%s\":\"%s\"", key, val
                    }
                    END { printf "}" }
                  ')

                  keys=$(printf '%s' "$tags_json" | jq -r 'keys | join(",")')
                  echo "Adding tags ($keys): $tags_json"
                  aws resourcegroupstaggingapi tag-resources --region "$region" \
                    --resource-arn-list "$resource_arn" \
                    --tags "$tags_json" >/dev/null
                  tags_keys="$keys"
                else
                  # remove_tags: expect CSV of keys, e.g. "Owner,Env"
                  # Strip whitespace, drop empties
                  keys_csv=$(printf '%s' "$tags_in" | awk -v RS=',' '
                    {
                      gsub(/^[ \t]+|[ \t]+$/, "")
                      if (length($0) == 0) next
                      if (out != "") out = out ","
                      out = out $0
                    }
                    END { print out }
                  ')
                  if [ -z "$keys_csv" ]; then
                    echo "ERROR: no valid tag keys provided to remove."
                    echo "       Example: Owner,Env"
                    exit 1
                  fi
                  # AWS CLI --tag-keys expects space-separated shorthand
                  keys_args=$(printf '%s' "$keys_csv" | tr ',' ' ')
                  echo "Removing tag keys: $keys_csv"
                  # shellcheck disable=SC2086
                  aws resourcegroupstaggingapi untag-resources --region "$region" \
                    --resource-arn-list "$resource_arn" \
                    --tag-keys $keys_args >/dev/null
                  tags_keys="$keys_csv"
                fi

                echo "Done. Current tags on resource:"
                aws resourcegroupstaggingapi get-resources --region "$region" \
                  --resource-arn-list "$resource_arn" \
                  --query "ResourceTagMappingList[0].Tags" --output table || true

                export resource_arn="$resource_arn"
                export region="$region"
                export action_taken="$action"
                export tags_keys="$tags_keys"
              outputs:
                - resource_arn
                - region
                - action_taken
                - tags_keys
