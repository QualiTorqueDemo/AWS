spec_version: 2
description: Restart an AWS EC2 instance.
metadata:
  self-service: false
  display-name: AWS EC2 Restart (Shell)
  icon:
    path: graphics/aws_ec2.svg
  blueprint-labels:
    - key: hypervisor
      value: AWS
      initial-color: orange
    - key: category
      value: Cloud
      initial-color: teal
    - key: Shell
      initial-color: frogGreen
workflow:
  scope: env_resource
  resource-types: aws_instance
  labels-selector: hypervisor:AWS
  triggers:
    - type: manual
  timeout: '15'
inputs:
  agent:
    type: agent
outputs:
  instance_id:
    value: '{{ .grains.ec2_restart.activities.deploy.commands.restart.outputs.instance_id }}'
    quick: true
  region:
    value: '{{ .grains.ec2_restart.activities.deploy.commands.restart.outputs.region }}'
    quick: true
  state_before:
    value: '{{ .grains.ec2_restart.activities.deploy.commands.restart.outputs.state_before }}'
    quick: true
  state_after:
    value: '{{ .grains.ec2_restart.activities.deploy.commands.restart.outputs.state_after }}'
    quick: true
grains:
  ec2_restart:
    kind: shell
    spec:
      agent:
        name: '{{ .inputs.agent }}'
      activities:
        deploy:
          commands:
            - name: restart
              command: "set -euo pipefail\n\nrid=\"{{ .bindings.resource_id }}\"\ngpath=\"{{ .bindings.grain_path }}\"\ncontract=\"$CONTRACT_FILE_PATH\"\n\ninstance_id=$(jq -r --arg ResourceId \"$rid\"\
                \ --arg GrainPath \"$gpath\" \\\n  '.resources[]\n    | select(.identifier == $ResourceId and .grain_path == $GrainPath)\n    | (.attributes.id // .attributes.instance_id // .attributes.InstanceId\
                \ // empty)' \\\n  \"$contract\")\n\nregion=$(jq -r --arg ResourceId \"$rid\" --arg GrainPath \"$gpath\" \\\n  '.resources[]\n    | select(.identifier == $ResourceId and .grain_path == $GrainPath)\n\
                \    | (.attributes.region // .attributes.aws_region // empty)' \\\n  \"$contract\")\n\nif [ -z \"${instance_id:-}\" ] || [ -z \"${region:-}\" ]; then\n  echo \"Failed to extract instance_id/region\
                \ from contract.json (resource_id=$rid, grain_path=$gpath)\"\n  exit 1\nfi\n\necho \"Target: instance_id=$instance_id region=$region\"\n\nstate_before=$(aws ec2 describe-instances --region\
                \ \"$region\" --instance-ids \"$instance_id\" \\\n  --query \"Reservations[0].Instances[0].State.Name\" --output text)\necho \"state_before=$state_before\"\n\necho \"Calling aws ec2 reboot-instances...\"\
                \naws ec2 reboot-instances --region \"$region\" --instance-ids \"$instance_id\" >/dev/null\n\nstate_after=$(aws ec2 describe-instances --region \"$region\" --instance-ids \"$instance_id\"\
                \ \\\n  --query \"Reservations[0].Instances[0].State.Name\" --output text)\necho \"state_after=$state_after\"\n\nexport instance_id=\"$instance_id\"\nexport region=\"$region\"\nexport state_before=\"\
                $state_before\"\nexport state_after=\"$state_after\"\n"
              outputs:
                - instance_id
                - region
                - state_before
                - state_after
