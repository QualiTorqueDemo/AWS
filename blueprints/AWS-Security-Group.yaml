spec_version: 2
description: Creates an AWS VPC security group. Pick a 'type' to load preset rules (HTTPS, MySQL, SSH, etc.) and supply the CIDRs that should be allowed through, or pick 'Custom' and define your own ingress
  rules.
metadata:
  self-service: true
  display-name: AWS Security Group
  icon:
    path: graphics/AWS Security Group.svg
  blueprint-labels:
    - key: hypervisor
      value: AWS
      initial-color: '#FF9900'
    - key: category
      value: Cloud
      initial-color: '#1E88E5'
    - key: Terraform
      initial-color: '#7B42BC'
inputs:
  name:
    type: string
    description: Security group name (1-255 chars). Must be unique within the VPC.
  description:
    type: string
    default: Managed by Torque
    description: Free-text description shown in the AWS console.
  vpc_id:
    type: string
    description: VPC in which to create the security group.
  type:
    type: string
    default: Custom
    description: Preset rule bundle. Picking a preset auto-adds the matching inbound port(s); set ingress_cidr_blocks to control who can use them. Pick Custom to define rules from scratch via ingress_with_cidr_blocks.
    allowed-values:
      - Custom
      - SSH
      - HTTP
      - HTTPS
      - MySQL
      - PostgreSQL
      - Redis
      - MongoDB
      - Kubernetes API
      - RDP
      - WinRM
  ingress_cidr_blocks:
    type: string
    default: '[]'
    description: JSON array of source CIDRs allowed by the preset rules, e.g. ["10.0.0.0/16","192.168.1.0/24"]. Ignored when type is "Custom".
  ingress_with_cidr_blocks:
    type: string
    default: '[]'
    description: 'JSON array of custom inbound rules. Each item: {"from_port": 8080, "to_port": 8080, "protocol": "tcp", "cidr_blocks": "10.0.0.0/16", "description": "..."}. Use with Custom type or alongside
      a preset.'
  resource_tags:
    type: string
    default: '{}'
    description: JSON map of tags applied to the security group.
  agent:
    type: agent
outputs:
  security_group_id:
    value: '{{ .grains.security_group.outputs.security_group_id }}'
    quick: true
grains:
  security_group:
    kind: terraform
    spec:
      source:
        store: AWS
        path: '{% capture _sg_subdir %}{% case inputs.type %}{% when ''Custom'' %}_templates{% when ''SSH'' %}ssh{% when ''HTTP'' %}http-80{% when ''HTTPS'' %}https-443{% when ''MySQL'' %}mysql{% when ''PostgreSQL''
          %}postgresql{% when ''Redis'' %}redis{% when ''MongoDB'' %}mongodb{% when ''Kubernetes API'' %}kubernetes-api{% when ''RDP'' %}rdp{% when ''WinRM'' %}winrm{% endcase %}{% endcapture %}assets/terraform-aws-security-group/modules/{{
          _sg_subdir }}'
      agent:
        name: '{{ .inputs.agent }}'
      tags:
        auto-tag: true
      inputs:
        - name: '{{ .inputs.name }}'
        - description: '{{ .inputs.description }}'
        - vpc_id: '{{ .inputs.vpc_id }}'
        - ingress_cidr_blocks: '{{ .inputs.ingress_cidr_blocks }}'
        - ingress_with_cidr_blocks: '{{ .inputs.ingress_with_cidr_blocks }}'
        - tags: '{{ .inputs.resource_tags }}'
        - create: 'true'
        - use_name_prefix: 'true'
        - revoke_rules_on_delete: 'false'
        - auto_computed_egress_rules: '[]'
        - auto_computed_egress_with_self: '[]'
        - auto_computed_ingress_rules: '[]'
        - auto_computed_ingress_with_self: '[]'
        - auto_number_of_computed_egress_rules: '0'
        - auto_number_of_computed_egress_with_self: '0'
        - auto_number_of_computed_ingress_rules: '0'
        - auto_number_of_computed_ingress_with_self: '0'
        - computed_egress_cidr_blocks: '[]'
        - computed_egress_ipv6_cidr_blocks: '[]'
        - computed_egress_prefix_list_ids: '[]'
        - computed_egress_rules: '[]'
        - computed_egress_with_cidr_blocks: '[]'
        - computed_egress_with_ipv6_cidr_blocks: '[]'
        - computed_egress_with_prefix_list_ids: '[]'
        - computed_egress_with_self: '[]'
        - computed_egress_with_source_security_group_id: '[]'
        - computed_ingress_cidr_blocks: '[]'
        - computed_ingress_ipv6_cidr_blocks: '[]'
        - computed_ingress_prefix_list_ids: '[]'
        - computed_ingress_rules: '[]'
        - computed_ingress_with_cidr_blocks: '[]'
        - computed_ingress_with_ipv6_cidr_blocks: '[]'
        - computed_ingress_with_prefix_list_ids: '[]'
        - computed_ingress_with_self: '[]'
        - computed_ingress_with_source_security_group_id: '[]'
        - egress_cidr_blocks: '[]'
        - egress_ipv6_cidr_blocks: '[]'
        - egress_prefix_list_ids: '[]'
        - egress_rules: '[]'
        - egress_with_cidr_blocks: '[{"from_port": 0, "to_port": 0, "protocol": "-1", "cidr_blocks": "0.0.0.0/0", "description": "allow-all-out"}]'
        - egress_with_ipv6_cidr_blocks: '[]'
        - egress_with_prefix_list_ids: '[]'
        - egress_with_self: '[]'
        - egress_with_source_security_group_id: '[]'
        - ingress_ipv6_cidr_blocks: '[]'
        - ingress_prefix_list_ids: '[]'
        - ingress_rules: '[]'
        - ingress_with_ipv6_cidr_blocks: '[]'
        - ingress_with_prefix_list_ids: '[]'
        - ingress_with_self: '[]'
        - ingress_with_source_security_group_id: '[]'
        - number_of_computed_egress_cidr_blocks: '0'
        - number_of_computed_egress_ipv6_cidr_blocks: '0'
        - number_of_computed_egress_prefix_list_ids: '0'
        - number_of_computed_egress_rules: '0'
        - number_of_computed_egress_with_cidr_blocks: '0'
        - number_of_computed_egress_with_ipv6_cidr_blocks: '0'
        - number_of_computed_egress_with_prefix_list_ids: '0'
        - number_of_computed_egress_with_self: '0'
        - number_of_computed_egress_with_source_security_group_id: '0'
        - number_of_computed_ingress_cidr_blocks: '0'
        - number_of_computed_ingress_ipv6_cidr_blocks: '0'
        - number_of_computed_ingress_prefix_list_ids: '0'
        - number_of_computed_ingress_rules: '0'
        - number_of_computed_ingress_with_cidr_blocks: '0'
        - number_of_computed_ingress_with_ipv6_cidr_blocks: '0'
        - number_of_computed_ingress_with_prefix_list_ids: '0'
        - number_of_computed_ingress_with_self: '0'
        - number_of_computed_ingress_with_source_security_group_id: '0'
      outputs:
        - security_group_id
    tf-version: 1.5.7
launch-form:
  categories:
    - name: Basic Configuration
      inputs:
        - name: agent
        - name: name
        - name: description
        - name: vpc_id
        - name: type
        - name: create
        - name: use_name_prefix
        - name: tags
    - name: Ingress Rules
      inputs:
        - name: auto_ingress_rules
        - name: auto_ingress_with_self
        - name: ingress_rules
        - name: ingress_cidr_blocks
        - name: ingress_ipv6_cidr_blocks
        - name: ingress_with_cidr_blocks
        - name: ingress_with_ipv6_cidr_blocks
        - name: ingress_with_self
        - name: ingress_with_source_security_group_id
        - name: ingress_prefix_list_ids
