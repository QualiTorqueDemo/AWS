spec_version: 2
description: Creates an IAM role that can be assumed via an OIDC identity provider (e.g. GitHub Actions OIDC, an EKS cluster OIDC issuer).
metadata:
  self-service: true
  display-name: AWS IAM Assumable Role with OIDC
  icon:
    path: graphics/AWS IAM.svg
  blueprint-labels:
    - key: hypervisor
      value: AWS
      initial-color: '#FF9900'
    - key: category
      value: Cloud
      initial-color: '#1E88E5'
    - key: Terraform
      initial-color: '#7B42BC'
inputs:
  role_name:
    type: string
    description: Name of the IAM role to create.
  provider_url:
    type: string
    description: OIDC issuer URL without the https:// prefix (e.g. "token.actions.githubusercontent.com" or "oidc.eks.us-east-1.amazonaws.com/id/EXAMPLE539D4633E53DE1B71EXAMPLE"). An IAM OIDC provider for
      this issuer must already exist in the account.
  oidc_subjects_with_wildcards:
    type: string
    default: '[]'
    description: JSON array of trusted "sub" claims that may contain wildcards, e.g. ["repo:my-org/my-repo:*"]. Leave [] when not using wildcards.
  role_policy_arns:
    type: string
    default: '[]'
    description: JSON array of IAM policy ARNs to attach to the role.
  resource_tags:
    type: string
    default: '{}'
    description: JSON map of tags applied to the IAM role.
  agent:
    type: agent
outputs:
  iam_role_arn:
    value: '{{ .grains.iam-assumable-role-with-oidc.outputs.iam_role_arn }}'
    quick: true
  iam_role_name:
    value: '{{ .grains.iam-assumable-role-with-oidc.outputs.iam_role_name }}'
    quick: false
  iam_role_path:
    value: '{{ .grains.iam-assumable-role-with-oidc.outputs.iam_role_path }}'
    quick: false
  iam_role_unique_id:
    value: '{{ .grains.iam-assumable-role-with-oidc.outputs.iam_role_unique_id }}'
    quick: false
grains:
  iam-assumable-role-with-oidc:
    kind: terraform
    spec:
      source:
        store: AWS
        path: assets/terraform-aws-iam-assumable-role-with-oidc
      agent:
        name: '{{ .inputs.agent }}'
      tags:
        auto-tag: true
      inputs:
        - role_name: '{{ .inputs.role_name }}'
        - provider_url: '{{ .inputs.provider_url }}'
        - oidc_subjects_with_wildcards: '{{ .inputs.oidc_subjects_with_wildcards }}'
        - oidc_fully_qualified_subjects: '[]'
        - role_policy_arns: '{{ .inputs.role_policy_arns }}'
        - tags: '{{ .inputs.resource_tags }}'
        - allow_self_assume_role: 'false'
        - aws_account_id: 'null'
        - create_role: 'true'
        - force_detach_policies: 'false'
        - max_session_duration: '3600'
        - number_of_role_policy_arns: 'null'
        - oidc_fully_qualified_audiences: '[]'
        - provider_urls: '[]'
        - role_description: 'null'
        - role_name_prefix: 'null'
        - role_path: /
        - role_permissions_boundary_arn: 'null'
      outputs:
        - iam_role_arn
        - iam_role_name
        - iam_role_path
        - iam_role_unique_id
    tf-version: 1.5.7
