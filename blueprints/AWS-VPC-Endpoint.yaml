spec_version: 2
description: Creates one or more VPC endpoints (Gateway or Interface) to AWS services from within a VPC, so traffic stays on the AWS backbone instead of going out via the IGW.
metadata:
  self-service: true
  display-name: AWS VPC Endpoint
  icon:
    path: graphics/VPC.svg
  blueprint-labels:
    - key: hypervisor
      value: AWS
      initial-color: '#FF9900'
    - key: category
      value: Cloud
      initial-color: '#1E88E5'
    - key: Terraform
      initial-color: '#7B42BC'
inputs:
  vpc_id:
    type: string
    description: VPC in which to create the endpoints.
  endpoints:
    type: string
    description: 'JSON map of endpoint configurations, e.g. {"s3": {"service": "s3", "service_type": "Gateway"}, "ec2": {"service": "ec2", "private_dns_enabled": true}}. See terraform-aws-modules/vpc/aws//modules/vpc-endpoints
      README for the full schema.'
  subnet_ids:
    type: string
    default: '[]'
    description: JSON array of subnet IDs for Interface endpoints (private endpoints in those subnets). Ignored for Gateway endpoints (S3, DynamoDB).
  security_group_ids:
    type: string
    default: '[]'
    description: JSON array of security group IDs to attach to Interface endpoints. Ignored for Gateway endpoints.
  resource_tags:
    type: string
    default: '{}'
    description: JSON map of tags applied to all created endpoints.
  agent:
    type: agent
outputs:
  endpoints:
    value: '{{ .grains.vpc-endpoints.outputs.endpoints }}'
    quick: false
  security_group_id:
    value: '{{ .grains.vpc-endpoints.outputs.security_group_id }}'
    quick: true
grains:
  vpc-endpoints:
    kind: terraform
    spec:
      source:
        store: AWS
        path: assets/terraform-aws-vpc-endpoints
      agent:
        name: '{{ .inputs.agent }}'
      tags:
        auto-tag: true
      inputs:
        - vpc_id: '{{ .inputs.vpc_id }}'
        - endpoints: '{{ .inputs.endpoints }}'
        - subnet_ids: '{{ .inputs.subnet_ids }}'
        - security_group_ids: '{{ .inputs.security_group_ids }}'
        - tags: '{{ .inputs.resource_tags }}'
        - create: 'true'
        - create_security_group: 'false'
        - security_group_description: 'null'
        - security_group_name: 'null'
        - security_group_name_prefix: 'null'
        - security_group_rules: '{}'
        - security_group_tags: '{}'
        - timeouts: '{}'
      outputs:
        - endpoints
        - security_group_id
    tf-version: 1.5.7
