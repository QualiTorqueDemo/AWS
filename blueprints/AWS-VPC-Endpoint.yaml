spec_version: 2
description: Creates VPC endpoints to AWS services so internal traffic stays on the AWS backbone instead of going out via the Internet Gateway. Pick a preset for common bundles (S3, EKS, Lambda) or use
  Custom to define endpoints inline.
metadata:
  self-service: true
  display-name: AWS VPC Endpoint
  icon:
    path: graphics/VPC.svg
  blueprint-labels:
    - key: hypervisor
      value: AWS
      initial-color: aws
    - key: category
      value: Cloud
      initial-color: teal
    - key: Terraform
      initial-color: pink
inputs:
  vpc_id:
    type: string
    description: VPC in which to create the endpoints.
  preset:
    type: string
    default: S3 (Gateway)
    description: "Bundle of endpoints to create.\n  - S3 (Gateway): free, single S3 Gateway endpoint (most common starting point).\n  - S3 + DynamoDB (Gateway): the two free Gateway-type services.\n  -\
      \ EKS essentials (Interface): ec2, ecr.api, ecr.dkr, sts, logs, elasticloadbalancing \u2014 needed by EKS clusters/pods.\n  - Lambda essentials: sts, logs, kms (Interface) + s3 (Gateway).\n  - Custom:\
      \ provide your own JSON via endpoints_custom."
    allowed-values:
      - S3 (Gateway)
      - S3 + DynamoDB (Gateway)
      - EKS essentials (Interface)
      - Lambda essentials
      - Custom
  route_table_ids:
    type: string
    default: '[]'
    description: JSON array of route table IDs to attach Gateway endpoints to, e.g. ["rtb-abc","rtb-def"]. REQUIRED for any preset that includes a Gateway endpoint (S3, DynamoDB). Use the AWS-VPC blueprint
      outputs "private_route_table_ids" and/or "public_route_table_ids".
  subnet_id_1:
    type: string
    default: ''
    description: First subnet ID for Interface endpoints (one ENI placed per subnet). Use a private subnet so traffic stays internal. Leave blank for Gateway endpoints (S3, DynamoDB) - they don't use subnets.
  subnet_id_2:
    type: string
    default: ''
    description: Second subnet ID (optional). Add subnets across different AZs for endpoint HA.
  subnet_id_3:
    type: string
    default: ''
    description: Third subnet ID (optional).
  security_group_ids:
    type: string
    default: '[]'
    description: JSON array of security group IDs to attach to Interface endpoints. Create via the AWS-Security-Group blueprint first. Ignored by Gateway endpoints.
  endpoints_custom:
    type: string
    default: '{}'
    description: 'Custom endpoints JSON (only used when preset=Custom). Format: {"<name>": {"service": "<aws-service>", "service_type": "Gateway|Interface", ...}, ...}. For Interface endpoints add "private_dns_enabled":
      true. For Gateway endpoints add "route_table_ids": [...]. See terraform-aws-modules/vpc-endpoints README.'
  resource_tags:
    type: string
    default: '{}'
    description: JSON map of tags applied to all created endpoints.
  agent:
    type: agent
outputs:
  endpoints:
    value: '{{ .grains.vpc-endpoints.outputs.endpoints }}'
    quick: true
grains:
  vpc-endpoints:
    kind: terraform
    spec:
      source:
        store: AWS
        path: assets/terraform-aws-vpc-endpoints
      agent:
        name: '{{ .inputs.agent }}'
      tags:
        auto-tag: true
      inputs:
        - vpc_id: '{{ .inputs.vpc_id }}'
        - endpoints: '{% case inputs.preset %}{% when ''S3 (Gateway)'' %}{"s3":{"service":"s3","service_type":"Gateway","route_table_ids":{{ inputs.route_table_ids }}}}{% when ''S3 + DynamoDB (Gateway)''
            %}{"s3":{"service":"s3","service_type":"Gateway","route_table_ids":{{ inputs.route_table_ids }}},"dynamodb":{"service":"dynamodb","service_type":"Gateway","route_table_ids":{{ inputs.route_table_ids
            }}}}{% when ''EKS essentials (Interface)'' %}{"ec2":{"service":"ec2","service_type":"Interface","private_dns_enabled":true},"ecr_api":{"service":"ecr.api","service_type":"Interface","private_dns_enabled":true},"ecr_dkr":{"service":"ecr.dkr","service_type":"Interface","private_dns_enabled":true},"sts":{"service":"sts","service_type":"Interface","private_dns_enabled":true},"logs":{"service":"logs","service_type":"Interface","private_dns_enabled":true},"elasticloadbalancing":{"service":"elasticloadbalancing","service_type":"Interface","private_dns_enabled":true}}{%
            when ''Lambda essentials'' %}{"sts":{"service":"sts","service_type":"Interface","private_dns_enabled":true},"logs":{"service":"logs","service_type":"Interface","private_dns_enabled":true},"kms":{"service":"kms","service_type":"Interface","private_dns_enabled":true},"s3":{"service":"s3","service_type":"Gateway","route_table_ids":{{
            inputs.route_table_ids }}}}{% when ''Custom'' %}{{ inputs.endpoints_custom }}{% endcase %}'
        - subnet_ids: '{% if inputs.subnet_id_1 == "" %}[]{% else %}["{{ .inputs.subnet_id_1 }}"{% if inputs.subnet_id_2 != "" %},"{{ .inputs.subnet_id_2 }}"{% endif %}{% if inputs.subnet_id_3 != "" %},"{{ .inputs.subnet_id_3 }}"{% endif %}]{% endif %}'
        - security_group_ids: '{{ .inputs.security_group_ids }}'
        - tags: '{{ .inputs.resource_tags }}'
        - create: 'true'
        - create_security_group: 'false'
        - security_group_description: 'null'
        - security_group_name: 'null'
        - security_group_name_prefix: 'null'
        - security_group_rules: '{}'
        - security_group_tags: '{}'
        - timeouts: '{}'
      outputs:
        - endpoints
    tf-version: 1.5.7
