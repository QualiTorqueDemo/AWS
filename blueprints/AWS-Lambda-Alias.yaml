spec_version: 2
description: Creates or refreshes a Lambda alias that points at a function version and (optionally) splits traffic between two versions for canary deployments.
metadata:
  self-service: true
  display-name: AWS Lambda Alias
  icon:
    path: graphics/AWS Lambda.svg
  blueprint-labels:
    - key: hypervisor
      value: AWS
      initial-color: '#FF9900'
    - key: category
      value: Cloud
      initial-color: '#1E88E5'
    - key: Terraform
      initial-color: '#7B42BC'
inputs:
  name:
    type: string
    description: Alias name (e.g. "live", "prod", "staging"). Lambda functions can have multiple aliases.
  function_name:
    type: string
    description: Name of the Lambda function the alias belongs to.
  function_version:
    type: string
    default: $LATEST
    description: Function version the alias points to. Use "$LATEST" for the most recent published version or a numeric version like "5".
  routing_additional_version_weights:
    type: string
    default: '{}'
    description: 'JSON map for canary traffic splits, e.g. {"7": 0.1} sends 10% of invocations to version 7 and 90% to function_version. Leave as {} for no split.'
  resource_tags:
    type: string
    default: '{}'
    description: Reserved for future use. Lambda aliases themselves don't carry tags.
  agent:
    type: agent
outputs:
  alias_arn:
    value: '{{ .grains.alias.outputs.lambda_alias_arn }}'
    quick: true
  alias_name:
    value: '{{ .grains.alias.outputs.lambda_alias_name }}'
    quick: false
  alias_function_version:
    value: '{{ .grains.alias.outputs.lambda_alias_function_version }}'
    quick: false
  alias_invoke_arn:
    value: '{{ .grains.alias.outputs.lambda_alias_invoke_arn }}'
    quick: true
grains:
  alias:
    kind: terraform
    spec:
      source:
        store: AWS
        path: assets/terraform-aws-lambda-alias
      agent:
        name: '{{ .inputs.agent }}'
      tags:
        auto-tag: true
      inputs:
        - name: '{{ .inputs.name }}'
        - function_name: '{{ .inputs.function_name }}'
        - function_version: '{{ .inputs.function_version }}'
        - routing_additional_version_weights: '{{ .inputs.routing_additional_version_weights }}'
        - create: 'true'
        - description: Lambda alias managed by Torque
        - allowed_triggers: '{}'
        - create_async_event_config: 'false'
        - create_qualified_alias_allowed_triggers: 'true'
        - create_qualified_alias_async_event_config: 'true'
        - create_version_allowed_triggers: 'false'
        - create_version_async_event_config: 'false'
        - destination_on_failure: 'null'
        - destination_on_success: 'null'
        - event_source_mapping: '{}'
        - maximum_event_age_in_seconds: 'null'
        - maximum_retry_attempts: 'null'
        - refresh_alias: 'true'
        - use_existing_alias: 'false'
      outputs:
        - lambda_alias_arn
        - lambda_alias_name
        - lambda_alias_function_version
        - lambda_alias_invoke_arn
    tf-version: 1.5.7
